<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Entrar como organizador | Clandy</title>
</head>

<body>

    <h1>Entrar a mi evento</h1>

    <p>
        Introduce tu código de organizador.
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="codigo_admin"
            placeholder="Código de organizador"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

    <a href="/">
        Volver
    </a>

</body>

</html>
