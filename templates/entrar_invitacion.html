<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Unirse a un evento | Clandy</title>
</head>

<body>

    <h1>Tengo una invitación</h1>

    <p>
        Introduce el código que te compartió
        el organizador.
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="codigo"
            placeholder="Código de invitación"
            required
        >

        <button type="submit">
            Continuar
        </button>

    </form>

    <a href="/">
        Volver
    </a>

</body>

</html>
