<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Unirse a Clandy</title>
</head>

<body>

    <h1>Unirse a Clandy</h1>

    <h2>{{ evento[1] }}</h2>

    <p>
        Completa tus datos para participar.
    </p>

    <form method="POST">

        <label>Nombre:</label>

        <input
            type="text"
            name="nombre"
            required
        >

        <br><br>

        <label>Correo:</label>

        <input
            type="email"
            name="correo"
            required
        >

        <br><br>

        <label>WhatsApp:</label>

        <input
            type="text"
            name="telefono"
            required
        >

        <br><br>

        <label>Presupuesto:</label>

        <input
            type="number"
            name="presupuesto"
            required
        >

        <br><br>

        <label>Gustos:</label>

        <textarea
            name="gustos"
        ></textarea>

        <br><br>

        <label>Disgustos:</label>

        <textarea
            name="disgustos"
        ></textarea>

        <br><br>

        <label>Hobbies:</label>

        <textarea
            name="hobbies"
        ></textarea>

        <br><br>

        <label>Colores:</label>

        <textarea
            name="colores"
        ></textarea>

        <br><br>

        <label>Tallas:</label>

        <textarea
            name="tallas"
        ></textarea>

        <br><br>

        <label>Lista de deseos:</label>

        <textarea
            name="deseos"
        ></textarea>

        <br><br>

        <button type="submit">
            Unirme al evento
        </button>

    </form>

</body>

</html>
