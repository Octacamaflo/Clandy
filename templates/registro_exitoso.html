<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro exitoso | Clandy</title>

</head>

<body>

    <h1>¡Ya estás dentro! 🎁</h1>

    <p>
        Hola, <strong>{{ nombre }}</strong>.
    </p>

    <p>
        Tu inscripción fue registrada correctamente.
    </p>

    <h2>Tu código de acceso</h2>

    <p>
        <strong>{{ codigo_acceso }}</strong>
    </p>

    <p>
        Guarda este código. Lo necesitarás para
        entrar posteriormente a tu espacio privado.
    </p>

    <p>
        <a href="{{ enlace_privado }}">
            Entrar a mi espacio privado
        </a>
    </p>

    <p>
        <a href="/">
            Volver a Clandy
        </a>
    </p>

</body>

</html>
